apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: '../positivo/positivo-signing-config.gradle'
apply from: '../gertec/gertec-signing-config.gradle'
apply from: '../ingenico/ingenico-signing-config.gradle'
apply from: '../sunmi/sunmi-signing-config.gradle'
apply from: '../tectoy/tectoy-signing-config.gradle'
android {
    compileSdkVersion 34
    buildToolsVersion '28.0.3'
    flavorDimensions = ["model"]
    namespace = "br.com.stonesdk.sdkdemo"
    compileSdk = 35
    defaultConfig {
        applicationId "br.com.stonesdk.sdkdemo"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig null
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }


}
// PRJHW-7286: versao do netclient usada pela NetClientTestActivity. O SDK 6.0.9-PR resolve 3.6.1.5.
def netclientVersion = '3.6.1.15'
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        // Alinha todos os modulos do netclient (inclusive os transitivos do SDK) na mesma versao.
        if (details.requested.group == 'br.com.stone.posandroid.net') {
            details.useVersion(netclientVersion)
        }
    }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.8.0'
    annotationProcessor "com.github.permissions-dispatcher:permissionsdispatcher-processor:4.8.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.3.0'
    debugImplementation "com.github.tony19:logback-android:2.0.0"
    debugImplementation "br.com.stone.sdk.android:debugmode:4.0.3"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
    implementation "br.com.stone:stone-sdk:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid:$stone_sdk_version"
    ingenicoImplementation "br.com.stone:stone-sdk-posandroid-ingenico:$stone_sdk_version"
    sunmiImplementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    sunmiSeriesPImplementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    tectoySeriesTImplementation "br.com.stone:stone-sdk-posandroid-tectoy:$stone_sdk_version"
    gertecGpos700Implementation "br.com.stone:stone-sdk-posandroid-gertec:$stone_sdk_version"
    gertecGposSeries7Implementation "br.com.stone:stone-sdk-posandroid-gertec-series7:$stone_sdk_version"
    positivoSeriesLImplementation "br.com.stone:stone-sdk-posandroid-positivo:$stone_sdk_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    // Netclient so esta no classpath de execucao (transitivo do SDK). Declarado aqui para a tela
    // NetClientTestActivity (PRJHW-7286) compilar. Mesma versao que o SDK 6.0.9-PR ja resolve.
    // transitive = false: o POM dessas libs aponta para artefatos raiz inexistentes nessa versao.
    implementation("br.com.stone.posandroid.net:client-android:$netclientVersion") { transitive = false }
    implementation("br.com.stone.posandroid.net:core-android:$netclientVersion") { transitive = false }
    implementation("br.com.stone.posandroid.net:common-android:$netclientVersion") { transitive = false }
    implementation("br.com.stone.posandroid.net:phc-common-android:$netclientVersion") { transitive = false }
    testImplementation "io.mockk:mockk:1.10.6"
    testImplementation "org.junit.platform:junit-platform-launcher:1.7.1"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:5.7.1"
    testImplementation "org.junit.vintage:junit-vintage-engine:5.7.1"
}